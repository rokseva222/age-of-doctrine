name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7-stable"
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/signing/upload.jks
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: upload
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: "Abhv3XYNCqUnry8kbIHa"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses >/dev/null || true
          $SDKM "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;3.10.2.4988404"
      - name: Godot 4.7 ve şablonlar
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates ~/.config/godot
          cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          curl -fsSL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q g.zip && chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          unzip -q t.tpz && mv templates ~/.local/share/godot/export_templates/4.7.stable
          ln -s ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot 2>/dev/null || sudo ln -s ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<S
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          S
      - name: Android derleme şablonu
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/4.7.stable/android_source.zip -d android/build
          echo -n "4.7.stable" > android/.build_version
          touch android/.gdignore
      - name: İçe aktar
        run: godot --headless --path . --import || true
      - name: AAB (Play için)
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/age-of-doctrine.aab
      - name: APK (telefonda deneme)
        run: godot --headless --path . --export-release "AndroidAPK" build/age-of-doctrine.apk
      - uses: actions/upload-artifact@v4
        with:
          name: age-of-doctrine-android
          path: build/*
      - name: Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/* --title "Derleme ${{ github.run_number }}" --notes "Otomatik derleme" --repo "${{ github.repository }}"
